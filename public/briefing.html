<!doctype html>
<html lang="pt-MZ">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VIZORA — Briefing de Projeto</title>
    <style>
        body {
            margin: 0;
            background: #f4f1eb;
            color: #111;
            font-family: Arial, sans-serif
        }

        .wrap {
            max-width: 930px;
            margin: auto;
            padding: 55px 22px
        }

        .brand {
            font: 500 31px Georgia, serif;
            margin-bottom: 38px
        }

        .ey {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #756f67
        }

        h1 {
            font: 500 52px Georgia, serif;
            margin: 5px 0 12px
        }

        .lead {
            color: #756f67;
            line-height: 1.6;
            max-width: 820px
        }

        .card {
            background: #fffdf9;
            border: 1px solid #d9d3c9;
            border-radius: 26px;
            padding: 28px;
            margin-top: 27px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .full {
            grid-column: 1/-1
        }

        .field {
            margin-bottom: 7px
        }

        .field label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #756f67;
            margin-bottom: 6px
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d9d3c9;
            border-radius: 12px;
            background: #fffdf9;
            font: inherit
        }

        .field textarea {
            min-height: 115px;
            resize: vertical
        }

        button {
            background: #111;
            color: #fff;
            border: 0;
            border-radius: 26px;
            padding: 12px 19px;
            cursor: pointer
        }

        .msg {
            font-size: 13px;
            color: #756f67;
            margin-top: 12px
        }

        @media(max-width:650px) {
            .grid {
                grid-template-columns: 1fr
            }

            .full {
                grid-column: auto
            }

            h1 {
                font-size: 39px
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="brand">VIZORA</div>
        <div class="ey">Briefing de projeto</div>
        <h1>Conte-nos o que precisa.</h1>
        <p class="lead">Preencha as informações abaixo. O briefing será recebido pela equipa da VIZORA e ficará
            disponível no nosso sistema interno para análise e preparação da proposta.</p>
        <form id="form" class="card">
            <div class="grid">
                <div class="field"><label>Nome *</label><input name="name" required></div>
                <div class="field"><label>Empresa</label><input name="company"></div>
                <div class="field"><label>WhatsApp / Telefone *</label><input name="phone" required></div>
                <div class="field"><label>Email</label><input name="email" type="email"></div>
                <div class="field"><label>Morada</label><input name="address"></div>
                <div class="field"><label>Serviço pretendido *</label><select name="service" required>
                        <option value="">Selecione</option>
                        <option>Marketing Digital</option>
                        <option>Design & Branding</option>
                        <option>Vídeo & Motion</option>
                        <option>Web & Technology</option>
                        <option>Soluções Digitais</option>
                    </select></div>
                <div class="field"><label>Prazo desejado</label><input name="deadline" placeholder="Ex.: 30 dias"></div>
                <div class="field"><label>Orçamento aproximado</label><input name="budget" placeholder="Ex.: 7.500 MZN">
                </div>
                <div class="field full"><label>Público-alvo</label><input name="audience"></div>
                <div class="field full"><label>Objetivo</label><textarea name="objective"></textarea></div>
                <div class="field full"><label>Detalhes / necessidades</label><textarea name="details"></textarea></div>
            </div><button>Enviar briefing</button>
            <div id="msg" class="msg"></div>
        </form>
    </div>
    <script>form.onsubmit = async e => {e.preventDefault(); msg.textContent = "A enviar..."; try {let r = await fetch("/api/briefing", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.fromEntries(new FormData(form)))}), j = await r.json(); msg.textContent = j.ok ? "Briefing enviado com sucesso. A VIZORA já recebeu os seus dados." : j.message || "Erro ao enviar."; if (j.ok) form.reset()} catch (err) {msg.textContent = "Não foi possível enviar. Verifique se o servidor está ativo."} }</script>
</body>

</html>
